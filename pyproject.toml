[project]
authors = [
        {name = "Zijun Gao", email = "Zijun_Gao@qq.com"},
        {name = "Olaf Lipinski", email = "olaf.lipinski@ntu.edu.sg"}
]
name = "dataugmenter"
description = "Time series data augmentation tool library."
requires-python = ">= 3.11"
version = "1.1.0"
dependencies = [
    "emd-signal>=1.10.0,<2",
    "matplotlib>=3.11.2,<4",
    "numpy>=2.5.3,<3",
    "openpyxl>=3.1.5,<4",
    "pandas>=3.0.6,<4",
    "scikit-posthocs>=0.17.0,<0.18",
    "scipy>=1.18.1,<2",
    "tqdm>=4.70.1,<5",
]
classifiers=[
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.6",
    "Programming Language :: Python :: 3.7",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[dependency-groups]
dev = ["pytest>=9.1.1,<10", "prek>=0.5.3,<0.6"]

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64"]

[tool.pixi.pypi-dependencies]
dataugmenter = { path = ".", editable = true }

[tool.pixi.environments]
default = { features = ["dev"], solve-group = "default" }

[tool.pixi.dependencies]
pixi-pycharm = ">=0.0.12,<0.0.13"
prek = ">=0.5.3,<0.6"
